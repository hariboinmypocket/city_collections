<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Collections | Lucy Sha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="background">
        <div class="lights" id="lights"></div>
    </div>

    <div class="container">
        <div class="content">
            <h1 class="title">City Collections</h1>
            <p class="byline">By Lucy Sha</p>
            <div class="divider"></div>
            <div class="quote-container">
                <p class="quote">
                    Twilight shattered into nightfall, and the cities are finally alive. 
                    Suddenly, the rush of thrill, newness, and love sweeps through, 
                    just like the solstice gifts us with the latest night.
                </p>
            </div>
        </div>
    </div>

    <div class="skyline"></div>
    <div class="horizon"></div>

    <script>
        // Generate floating city lights
        function createLights() {
            const container = document.getElementById('lights');
            const lightCount = 50;

            for (let i = 0; i < lightCount; i++) {
                const light = document.createElement('div');
                light.className = 'light';
                
                // Position lights mostly in lower half (city area)
                const x = Math.random() * 100;
                const y = 50 + Math.random() * 45;
                
                light.style.left = `${x}%`;
                light.style.top = `${y}%`;
                light.style.setProperty('--delay', `${Math.random() * 5}s`);
                light.style.setProperty('--duration', `${2 + Math.random() * 3}s`);
                
                // Vary the light colors slightly
                const hue = 35 + Math.random() * 20; // warm yellows to oranges
                light.style.background = `hsl(${hue}, 70%, 60%)`;
                light.style.boxShadow = `0 0 ${4 + Math.random() * 4}px 2px hsla(${hue}, 70%, 60%, 0.3)`;
                
                container.appendChild(light);
            }
        }

        createLights();
    </script>
</body>
</html>
